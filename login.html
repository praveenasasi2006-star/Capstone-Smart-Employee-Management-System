<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Employee Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2ff, #f8eaff);
            min-height: 100vh;
        }

        /* LOGIN */

        #loginPage {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .login-box h1 {
            text-align: center;
            color: #5b4bdb;
            margin-bottom: 10px;
        }

        .login-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #6757e8;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 8px;
            background: #6757e8;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #5142c9;
        }

        #error {
            color: red;
            text-align: center;
            margin-top: 12px;
        }

        /* DASHBOARD */

        #dashboard {
            display: none;
        }

        .navbar {
            background: white;
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            color: #5b4bdb;
            font-size: 22px;
            font-weight: bold;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .welcome h2 {
            color: #333;
            margin-bottom: 8px;
        }

        /* CARDS */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            color: #777;
        }

        .card h2 {
            color: #5b4bdb;
            font-size: 30px;
            margin-top: 10px;
        }

        /* EMPLOYEE FORM */

        .employee-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .employee-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .form-grid input {
            margin-bottom: 5px;
        }

        .add-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-btn {
            margin-top: 20px;
            margin-left: 10px;
            padding: 12px 25px;
            background: #777;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        /* SEARCH */

        .search {
            margin-bottom: 20px;
        }

        /* TABLE */

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #6757e8;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .edit-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media(max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .navbar {
                padding: 15px;
            }

            .container {
                width: 95%;
            }
        }
    </style>
</head>

<body>

    <!-- ================= LOGIN PAGE ================= -->

    <div id="loginPage">

        <div class="login-box">

            <h1>✨ SMART EMPLOYEE</h1>

            <p>Employee Management System</p>

            <form onsubmit="login(event)">

                <label>Email ID</label>

                <input type="email" id="email" placeholder="Enter email" required>

                <label>Password</label>

                <input type="password" id="password" placeholder="Enter password" required>

                <button class="login-btn" type="submit">
                    Login
                </button>

                <div id="error"></div>

            </form>

        </div>

    </div>


    <!-- ================= DASHBOARD ================= -->

    <div id="dashboard">

        <div class="navbar">

            <div class="logo">
                ✨ SMART EMPLOYEE
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>


        <div class="container">

            <div class="welcome">

                <h2>Welcome to Employee Management</h2>

                <p>Manage employee information easily.</p>

            </div>


            <!-- STATISTICS -->

            <div class="cards">

                <div class="card">

                    <h3>Total Employees</h3>

                    <h2 id="totalEmployees">0</h2>

                </div>

                <div class="card">

                    <h3>Departments</h3>

                    <h2 id="totalDepartments">0</h2>

                </div>

                <div class="card">

                    <h3>Active Employees</h3>

                    <h2 id="activeEmployees">0</h2>

                </div>

            </div>


            <!-- ADD EMPLOYEE -->

            <div class="employee-box">

                <h2 id="formTitle">
                    Add New Employee
                </h2>

                <div class="form-grid">

                    <div>

                        <label>Employee ID</label>

                        <input type="text" id="empId" placeholder="EMP001">

                    </div>


                    <div>

                        <label>Employee Name</label>

                        <input type="text" id="empName" placeholder="Enter employee name">

                    </div>


                    <div>

                        <label>Email</label>

                        <input type="email" id="empEmail" placeholder="employee@gmail.com">

                    </div>


                    <div>

                        <label>Phone</label>

                        <input type="text" id="empPhone" placeholder="Enter phone number">

                    </div>


                    <div>

                        <label>Department</label>

                        <input type="text" id="empDepartment" placeholder="IT / HR / Finance">

                    </div>


                    <div>

                        <label>Salary</label>

                        <input type="number" id="empSalary" placeholder="Enter salary">

                    </div>

                </div>


                <button class="add-btn" id="saveButton" onclick="saveEmployee()">
                    Add Employee
                </button>


                <button class="clear-btn" onclick="clearForm()">
                    Clear
                </button>

            </div>


            <!-- VIEW EMPLOYEES -->

            <div class="table-box">

                <h2>Employee List</h2>

                <input class="search" type="text" id="search" placeholder="🔍 Search employee..."
                    onkeyup="displayEmployees()">


                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Name</th>

                            <th>Email</th>

                            <th>Phone</th>

                            <th>Department</th>

                            <th>Salary</th>

                            <th>Action</th>

                        </tr>

                    </thead>


                    <tbody id="employeeTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script>

        /* ================= LOGIN ================= */

        function login(event) {

            event.preventDefault();

            let email =
                document.getElementById("email").value.trim();

            let password =
                document.getElementById("password").value;


            let emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            let passwordPattern =
                /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;


            if (!emailPattern.test(email)) {

                document.getElementById("error").innerText =
                    "Enter a valid email.";

                return;
            }


            if (!passwordPattern.test(password)) {

                document.getElementById("error").innerText =
                    "Password must have 8 characters, uppercase, lowercase, number and special character.";

                return;
            }


            document.getElementById("loginPage").style.display =
                "none";

            document.getElementById("dashboard").style.display =
                "block";


            displayEmployees();

        }


        /* ================= LOGOUT ================= */

        function logout() {

            document.getElementById("dashboard").style.display =
                "none";

            document.getElementById("loginPage").style.display =
                "flex";

            document.getElementById("email").value = "";

            document.getElementById("password").value = "";

        }


        /* ================= EMPLOYEE DATA ================= */

        let employees =
            JSON.parse(localStorage.getItem("employees")) || [];


        let editIndex = -1;


        /* ================= SAVE EMPLOYEE ================= */

        function saveEmployee() {

            let id =
                document.getElementById("empId").value.trim();

            let name =
                document.getElementById("empName").value.trim();

            let email =
                document.getElementById("empEmail").value.trim();

            let phone =
                document.getElementById("empPhone").value.trim();

            let department =
                document.getElementById("empDepartment").value.trim();

            let salary =
                document.getElementById("empSalary").value.trim();


            if (
                id === "" ||
                name === "" ||
                email === "" ||
                phone === "" ||
                department === "" ||
                salary === ""
            ) {

                alert("Please fill all employee details.");

                return;
            }


            let employee = {

                id: id,

                name: name,

                email: email,

                phone: phone,

                department: department,

                salary: salary

            };


            /* INSERT / UPDATE */

            if (editIndex === -1) {

                employees.push(employee);

                alert("Employee added successfully!");

            } else {

                employees[editIndex] = employee;

                alert("Employee updated successfully!");

                editIndex = -1;

                document.getElementById("formTitle").innerText =
                    "Add New Employee";

                document.getElementById("saveButton").innerText =
                    "Add Employee";
            }


            localStorage.setItem(
                "employees",
                JSON.stringify(employees)
            );


            clearForm();

            displayEmployees();

        }


        /* ================= DISPLAY EMPLOYEES ================= */

        function displayEmployees() {

            let table =
                document.getElementById("employeeTable");

            let search =
                document.getElementById("search").value.toLowerCase();


            table.innerHTML = "";


            employees.forEach(function (employee, index) {

                let text =
                    employee.id.toLowerCase() +
                    employee.name.toLowerCase() +
                    employee.email.toLowerCase() +
                    employee.department.toLowerCase();


                if (text.includes(search)) {

                    let row = `

                <tr>

                    <td>${employee.id}</td>

                    <td>${employee.name}</td>

                    <td>${employee.email}</td>

                    <td>${employee.phone}</td>

                    <td>${employee.department}</td>

                    <td>₹${employee.salary}</td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick="editEmployee(${index})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteEmployee(${index})"
                        >
                            Delete
                        </button>

                    </td>

                </tr>

            `;


                    table.innerHTML += row;

                }

            });


            updateStatistics();

        }


        /* ================= EDIT ================= */

        function editEmployee(index) {

            let employee = employees[index];


            document.getElementById("empId").value =
                employee.id;

            document.getElementById("empName").value =
                employee.name;

            document.getElementById("empEmail").value =
                employee.email;

            document.getElementById("empPhone").value =
                employee.phone;

            document.getElementById("empDepartment").value =
                employee.department;

            document.getElementById("empSalary").value =
                employee.salary;


            editIndex = index;


            document.getElementById("formTitle").innerText =
                "Update Employee";


            document.getElementById("saveButton").innerText =
                "Update Employee";


            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        }


        /* ================= DELETE ================= */

        function deleteEmployee(index) {

            let confirmDelete =
                confirm("Are you sure you want to delete this employee?");


            if (confirmDelete) {

                employees.splice(index, 1);


                localStorage.setItem(
                    "employees",
                    JSON.stringify(employees)
                );


                displayEmployees();

                alert("Employee deleted successfully!");

            }

        }


        /* ================= CLEAR FORM ================= */

        function clearForm() {

            document.getElementById("empId").value = "";

            document.getElementById("empName").value = "";

            document.getElementById("empEmail").value = "";

            document.getElementById("empPhone").value = "";

            document.getElementById("empDepartment").value = "";

            document.getElementById("empSalary").value = "";


            editIndex = -1;


            document.getElementById("formTitle").innerText =
                "Add New Employee";


            document.getElementById("saveButton").innerText =
                "Add Employee";

        }


        /* ================= STATISTICS ================= */

        function updateStatistics() {

            document.getElementById("totalEmployees").innerText =
                employees.length;


            let departments = [];


            employees.forEach(function (employee) {

                if (!departments.includes(employee.department)) {

                    departments.push(employee.department);

                }

            });


            document.getElementById("totalDepartments").innerText =
                departments.length;


            document.getElementById("activeEmployees").innerText =
                employees.length;

        }

    </script>

</body>

</html>
