<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2ff, #f8eaff);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #6c3cff;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            padding: 12px 22px;
            border: none;
            border-radius: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
        }

        .delete {
            background: #ff4d6d;
        }

        .back {
            background: #555;
        }

        #message {
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🗑️ Delete Employee</h1>

        <input type="text" id="employeeId" placeholder="Enter Employee ID">

        <button class="delete" onclick="deleteEmployee()">
            Delete Employee
        </button>

        <button class="back" onclick="location.href='home.html'">
            Back
        </button>

        <p id="message"></p>

    </div>

    <script>
        function deleteEmployee() {

            let id = document.getElementById("employeeId").value.trim();

            let employees =
                JSON.parse(localStorage.getItem("employees")) || [];

            let index = employees.findIndex(emp => emp.id === id);

            if (index === -1) {
                document.getElementById("message").style.color = "red";
                document.getElementById("message").innerText =
                    "Employee ID not found!";
                return;
            }

            employees.splice(index, 1);

            localStorage.setItem("employees", JSON.stringify(employees));

            document.getElementById("message").style.color = "green";
            document.getElementById("message").innerText =
                "Employee deleted successfully!";

            document.getElementById("employeeId").value = "";
        }
    </script>

</body>

</html>
