<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee - Smart Employee Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0f2ff, #f8eaff);
            padding: 40px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #6c3cff;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn {
            background: #6c3cff;
        }

        .back-btn {
            background: #555;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>➕ Add Employee</h1>

        <form id="employeeForm">

            <label>Employee Name</label>
            <input type="text" id="employeeName" required>

            <label>Email</label>
            <input type="email" id="employeeEmail" required>

            <label>Phone</label>
            <input type="tel" id="employeePhone" required>

            <label>Department</label>
            <input type="text" id="employeeDepartment" required>

            <label>Designation</label>
            <input type="text" id="employeeDesignation" required>

            <label>Salary</label>
            <input type="number" id="employeeSalary" required>

            <label>Joining Date</label>
            <input type="date" id="employeeJoiningDate" required>

            <div class="buttons">
                <button type="submit" class="add-btn">
                    Add Employee
                </button>

                <button type="button" class="back-btn" onclick="location.href='home.html'">
                    Back
                </button>
            </div>

        </form>

        <p id="message"></p>

    </div>

    <script>

        document.getElementById("employeeForm").addEventListener("submit", async function (event) {

            event.preventDefault();

            const employee = {

                name: document.getElementById("employeeName").value.trim(),

                email: document.getElementById("employeeEmail").value.trim(),

                phone: document.getElementById("employeePhone").value.trim(),

                department: document.getElementById("employeeDepartment").value.trim(),

                designation: document.getElementById("employeeDesignation").value.trim(),

                salary: document.getElementById("employeeSalary").value.trim(),

                joiningDate: document.getElementById("employeeJoiningDate").value

            };

            try {

                const response = await fetch("http://localhost:8080/api/employees", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(employee)

                });

                if (!response.ok) {
                    throw new Error("Failed");
                }

                document.getElementById("message").style.color = "green";

                document.getElementById("message").textContent =
                    "Employee added successfully!";

                document.getElementById("employeeForm").reset();

            } catch (error) {

                document.getElementById("message").style.color = "red";

                document.getElementById("message").textContent =
                    "Backend connection failed!";

                console.error(error);
            }

        });

    </script>

</body>

</html>
